spring:
  application:
    name: pets-v2
  datasource:
    url: jdbc:postgresql://localhost:5432/pets
    username: pets_user
    password: pets_pass
  jpa:
    hibernate:
      ddl-auto: validate   # schema é controlado pelo Flyway, não pelo Hibernate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /docs
